name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (retry transient download failures)
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed; waiting 30 seconds before retrying cached dependencies..."
              sleep 30
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-editor-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
